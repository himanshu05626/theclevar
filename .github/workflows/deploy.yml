name: 🚀 Deploy Next.js to VPS

on:
  push:
    branches:
      - main
      - stag

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 🔐 Setup SSH
      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 🔍 Debug SSH
      - name: 🔍 Check SSH Key
        run: ssh-add -l

      # 🚀 Deploy
      - name: 🚀 Deploy to VPS
        run: |
          BRANCH=${GITHUB_REF##*/}
          echo "🚀 Deploying branch: $BRANCH"

          ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} << EOF

          # ✅ Load Node
          export PATH=/www/server/nodejs/v22.17.1/bin:\$PATH

          echo "📦 Branch: $BRANCH"

          # ✅ Set folder
          if [ "$BRANCH" = "main" ]; then
            APP_DIR="/www/wwwroot/theclevar"
            APP_NAME="clevar"
          elif [ "$BRANCH" = "stag" ]; then
            APP_DIR="/www/wwwroot/theclevarstag"
            APP_NAME="clevar-stag"
          else
            echo "❌ Unknown branch: $BRANCH"
            exit 1
          fi

          echo "📁 Path: \$APP_DIR"

          cd /www/wwwroot

          # ✅ Clone or pull
          if [ ! -d "\$APP_DIR" ]; then
            echo "📥 First clone..."
            git clone git@github.com:himanshu05626/theclevar.git \$(basename \$APP_DIR)
            cd \$APP_DIR
            git checkout $BRANCH
          else
            echo "🔄 Updating..."
            cd \$APP_DIR
            git fetch origin
            git reset --hard origin/$BRANCH
          fi

          # ✅ Install
          npm install

          # ✅ Prisma
          npx prisma generate

          # ✅ Build
          npm run build

          # ✅ PM2
          pm2 describe \$APP_NAME > /dev/null 2>&1
          if [ \$? -eq 0 ]; then
            pm2 restart \$APP_NAME
          else
            pm2 start npm --name "\$APP_NAME" -- start
          fi

          echo "✅ Done for $BRANCH"

          EOF