name: 🚀 Deploy Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout (required)
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 🔐 Setup SSH
      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 🔍 Debug SSH
      - name: 🔍 Check SSH Key
        run: ssh-add -l

      # 🚀 Deploy
      - name: 🚀 Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'

          # ✅ Load Node (aaPanel)
          export PATH=/www/server/nodejs/v22.17.1/bin:$PATH

          echo "🔎 Node Version:"
          node -v
          npm -v

          # ✅ Go to root folder
          cd /www/wwwroot

          # ✅ Clone if not exists, else pull
          if [ ! -d "theclevar" ]; then
            echo "📥 First time clone..."
            git clone git@github.com:himanshu05626/theclevar.git
          else
            echo "🔄 Updating repo..."
            cd theclevar
            git reset --hard
            git pull origin main
            cd ..
          fi

          cd /www/wwwroot/theclevar

          # ✅ Install dependencies
          echo "📦 Installing dependencies..."
          npm install

          # ✅ Prisma
          echo "⚙️ Prisma generate..."
          npx prisma generate

          # ✅ Build
          echo "🏗️ Building app..."
          npm run build

          # ✅ Restart PM2 (zero crash safe)
          echo "🔄 Restarting PM2..."
          pm2 describe clevar > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            pm2 restart clevar
          else
            pm2 start npm --name "clevar" -- start
          fi

          echo "✅ Deployment Successful!"

          EOF