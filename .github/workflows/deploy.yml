name: 🚀 Deploy Next.js to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 👇 ADD THIS DEBUG STEP
      - name: 🔍 Check SSH Key Loaded
        run: ssh-add -l

      - name: 🚀 Deploy to VPS
        run: |
          ssh -vvv -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'

          cd /www/wwwroot/theclevar

          git pull origin main
          npm install
          npx prisma generate
          npm run build
          pm2 restart clevar || pm2 start npm --name "clevar" -- start

          EOF
          