name: 🚀 Deploy Next.js to VPS (Fresh Clone Safe)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout repo (required for workflow)
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # 🔐 Setup SSH
      - name: 🔐 Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 🔍 Debug SSH key (optional but useful)
      - name: 🔍 Check SSH Key Loaded
        run: ssh-add -l

      # 🚀 Deploy to VPS
      - name: 🚀 Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.USERNAME }}@${{ secrets.HOST }} << 'EOF'

          # ✅ Load aaPanel Node
          export PATH=/www/server/nodejs/v22.17.1/bin:$PATH

          echo "🔎 Checking Node & NPM..."
          node -v
          npm -v

          cd /www/wwwroot

          # ✅ Backup .env if exists
          if [ -f /www/wwwroot/theclevar/.env ]; then
            echo "💾 Backing up .env..."
            cp /www/wwwroot/theclevar/.env /www/wwwroot/.env.backup
          fi

          # ✅ Remove old project
          echo "🗑️ Deleting old project..."
          rm -rf /www/wwwroot/theclevar

          # ✅ Fresh clone
          echo "📥 Cloning fresh repo..."
          git clone https://github.com/himanshu05626/theclevar.git

          cd /www/wwwroot/theclevar

          # ✅ Restore .env
          if [ -f /www/wwwroot/.env.backup ]; then
            echo "♻️ Restoring .env..."
            mv /www/wwwroot/.env.backup /www/wwwroot/theclevar/.env
          fi

          # ✅ Install deps
          echo "📦 Installing dependencies..."
          npm install

          # ✅ Prisma
          echo "⚙️ Generating Prisma..."
          npx prisma generate

          # ✅ Build
          echo "🏗️ Building Next.js..."
          npm run build

          # ✅ Restart PM2
          echo "🔄 Restarting PM2..."
          pm2 restart clevar || pm2 start npm --name "clevar" -- start

          echo "✅ Deployment Done!"

          EOF